name: V19 Tenant Context Hardening

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - 'tools/v19_tenant_context.py'
      - '.github/workflows/v19-tenant-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tenant-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Apply tenant context hardening
        run: python3 tools/v19_tenant_context.py
      - name: Install frontend dependencies
        working-directory: source
        run: npm ci
      - name: Production gate, tenant scan, type check and build
        working-directory: source
        run: |
          npm run check:production
          if grep -R -n -E "['\"](market-1|branch-1)['\"]" src --include='*.ts' --include='*.tsx'; then
            echo 'Hardcoded tenant identifiers are forbidden.'
            exit 1
          fi
          npx tsc --noEmit
          npm run build
      - name: Commit verified tenant hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/src/stores/dataStore.ts
          if git diff --cached --quiet; then
            echo 'Tenant context already hardened.'
            exit 0
          fi
          git commit -m 'Bind v19 local data writes to authenticated tenant context'
          git push origin HEAD:v19-production-readiness
