name: V19 Operational Write Authority

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - 'tools/v19_add_operations_authority.py'
      - '.github/workflows/v19-operations-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  operations-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhirox
          POSTGRES_PASSWORD: zhirox_test_password
          POSTGRES_DB: zhirox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhirox -d zhirox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zhirox:zhirox_test_password@127.0.0.1:5432/zhirox_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Generate authoritative operational writes
        run: python3 tools/v19_add_operations_authority.py
      - name: Syntax-check server
        working-directory: source/server
        run: node --check src/app.mjs
      - name: Install and audit server
        working-directory: source/server
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Run all PostgreSQL operation, offline, financial, catalog and user tests
        working-directory: source/server
        run: npm test
      - name: Revalidate frontend production build
        working-directory: source
        run: |
          npm ci
          npm run check:production
          npx tsc --noEmit
          npm run build
      - name: Operational accounting guards
        working-directory: source/server
        run: |
          grep -q "customer-receipt" src/app.mjs
          grep -q "sale-return" src/app.mjs
          grep -q "stock-adjust" src/app.mjs
          grep -q "cash-sessions/close" src/app.mjs
          grep -q "6000-GENERAL-EXPENSE" src/app.mjs
      - name: Commit verified operational authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/server
          if git diff --cached --quiet; then
            echo 'Operational authority already committed.'
            exit 0
          fi
          git commit -m 'Add authoritative returns debt stock expense and cash-session operations'
          git push origin HEAD:v19-production-readiness
