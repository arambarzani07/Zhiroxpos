name: V19 Dependency Security Audit

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - '.github/workflows/v19-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Audit production dependencies
        working-directory: source
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies for critical vulnerabilities
        working-directory: source
        run: npm audit --audit-level=critical
