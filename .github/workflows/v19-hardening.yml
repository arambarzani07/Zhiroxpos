name: V19 Production Hardening

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - 'tools/v19_harden.py'
      - '.github/workflows/v19-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Apply production hardening
        run: python3 tools/v19_harden.py
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Production gate
        working-directory: source
        run: npm run check:production
      - name: TypeScript and production build
        working-directory: source
        run: |
          npx tsc --noEmit
          npm run build
      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Harden v19 auth and remove demo production data'
          git push origin HEAD:v19-production-readiness
