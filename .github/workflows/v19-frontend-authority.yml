name: V19 Frontend Authority and Daily CRUD

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - 'tools/v19_frontend_authority_fixups.py'
      - '.github/workflows/v19-frontend-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhirox
          POSTGRES_PASSWORD: zhirox_test_password
          POSTGRES_DB: zhirox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhirox -d zhirox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zhirox:zhirox_test_password@127.0.0.1:5432/zhirox_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Generate and harden authoritative frontend wiring
        run: python3 tools/v19_frontend_authority_fixups.py
      - name: Syntax-check server
        working-directory: source/server
        run: node --check src/app.mjs
      - name: Install and audit server
        working-directory: source/server
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Run PostgreSQL CRUD, sale, race and catalog tests
        working-directory: source/server
        run: npm test
      - name: Install frontend
        working-directory: source
        run: npm ci
      - name: Production authority gates
        working-directory: source
        run: |
          npm run check:production
          if grep -R -n -E "completeSale\(user\.id\)|Math\.random\(\).*sale|Math\.random\(\).*operation" src/pages/POS.tsx src/services/serverApi.ts; then
            echo 'POS local financial authority or insecure operation IDs remain.'
            exit 1
          fi
      - name: TypeScript and production build
        working-directory: source
        run: |
          npx tsc --noEmit
          npm run build
      - name: Commit verified authoritative wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/src source/server
          if git diff --cached --quiet; then
            echo 'Authoritative frontend wiring already committed.'
            exit 0
          fi
          git commit -m 'Wire v19 POS and daily CRUD to authoritative server'
          git push origin HEAD:v19-production-readiness
