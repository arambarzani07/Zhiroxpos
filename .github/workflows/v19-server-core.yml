name: V19 Authoritative Server Core

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - 'tools/v19_add_server_core.py'
      - '.github/workflows/v19-server-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhirox
          POSTGRES_PASSWORD: zhirox_test_password
          POSTGRES_DB: zhirox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhirox -d zhirox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zhirox:zhirox_test_password@127.0.0.1:5432/zhirox_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Generate authoritative server core
        run: python3 tools/v19_add_server_core.py
      - name: Install current PostgreSQL driver and lock it
        working-directory: source/server
        run: npm install pg@latest --save-exact
      - name: Block high dependency vulnerabilities
        working-directory: source/server
        run: npm audit --omit=dev --audit-level=high
      - name: Run PostgreSQL integration tests
        working-directory: source/server
        run: npm test
      - name: Revalidate frontend production build
        working-directory: source
        run: |
          npm ci
          npm run check:production
          npx tsc --noEmit
          npm run build
      - name: Commit verified authoritative core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/server
          if git diff --cached --quiet; then
            echo 'Authoritative core already committed.'
            exit 0
          fi
          git commit -m 'Add v19 authoritative auth and receipt server core'
          git push origin HEAD:v19-production-readiness
