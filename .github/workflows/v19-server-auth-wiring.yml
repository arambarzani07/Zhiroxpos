name: V19 Authoritative Frontend Auth Wiring

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - 'tools/v19_wire_server_auth.py'
      - '.github/workflows/v19-server-auth-wiring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhirox
          POSTGRES_PASSWORD: zhirox_test_password
          POSTGRES_DB: zhirox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhirox -d zhirox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zhirox:zhirox_test_password@127.0.0.1:5432/zhirox_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Wire frontend to authoritative auth server
        run: python3 tools/v19_wire_server_auth.py
      - name: Install and audit server
        working-directory: source/server
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Run PostgreSQL integration tests
        working-directory: source/server
        run: npm test
      - name: Install frontend
        working-directory: source
        run: npm ci
      - name: Production authority gate
        working-directory: source
        run: |
          npm run check:production
          if grep -R -n -E "passwordHash|passwordSalt|credentials:[[:space:]]*\[|localStorage.*password" src/stores src/pages --include='*.ts' --include='*.tsx'; then
            echo 'Browser-local credential authority is forbidden in production.'
            exit 1
          fi
      - name: TypeScript and production build
        working-directory: source
        run: |
          npx tsc --noEmit
          npm run build
      - name: Commit verified server-auth wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/src source/server/src source/scripts/check-production-readiness.mjs
          if git diff --cached --quiet; then
            echo 'Server-auth wiring already committed.'
            exit 0
          fi
          git commit -m 'Use authoritative server sessions for v19 frontend auth'
          git push origin HEAD:v19-production-readiness
