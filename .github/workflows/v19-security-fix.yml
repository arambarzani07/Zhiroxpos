name: V19 Dependency Security Fix

on:
  push:
    branches:
      - v19-production-readiness
    paths:
      - '.github/workflows/v19-security-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-production-readiness
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Apply non-breaking npm security fixes
        working-directory: source
        run: npm audit fix
      - name: Block high production vulnerabilities
        working-directory: source
        run: npm audit --omit=dev --audit-level=high
      - name: Production gate and build
        working-directory: source
        run: |
          npm run check:production
          npx tsc --noEmit
          npm run build
      - name: Commit verified dependency updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/package.json source/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency updates required.'
            exit 0
          fi
          git commit -m 'Update vulnerable production dependencies for v19'
          git push origin HEAD:v19-production-readiness
